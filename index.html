
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NK AI CLIPPER</title>
<style>
body{
 margin:0;
 padding:25px 18px;
 background:#10111b;
 color:white;
 font-family:Arial;
 text-align:center;
}
.container{max-width:500px;margin:55px auto}
h1{color:#8b75ff;font-size:32px}
.box{
 background:#1d2030;
 padding:25px;
 border-radius:18px;
 margin-top:30px;
}
input{
 width:100%;
 box-sizing:border-box;
 padding:16px;
 border-radius:10px;
 border:1px solid #555;
 background:#10111b;
 color:white;
 font-size:15px;
 margin:15px 0;
}
button{
 width:100%;
 padding:17px;
 border:0;
 border-radius:10px;
 background:#7657ff;
 color:white;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
}
#message{
 margin-top:20px;
 color:#bcaaff;
 line-height:1.5;
}
</style>
</head>
<body>
<div class="container">
<h1>NK AI CLIPPER</h1>
<p>Your Personal AI Video Editor</p>
<div class="box">
<h2>Create Viral Shorts</h2>
<p>Paste your YouTube video link</p>

<input id="video" type="url"
placeholder="Paste YouTube URL here">

<button type="button" id="create">
CREATE CLIPS
</button>

<p id="message">Ready to create clips!</p>
</div>
</div>

<script>
document.getElementById("create")
.addEventListener("click", function(){

 const url = document.getElementById("video").value.trim();
 const message = document.getElementById("message");

 if(!url){
   message.textContent = "Please paste a YouTube link first!";
   return;
 }

 if(!url.includes("youtube.com") &&
    !url.includes("youtu.be")){
   message.textContent = "Please enter a valid YouTube link!";
   return;
 }

 message.textContent =
 "Success! Your YouTube link has been received. AI processing is not connected yet.";
});
</script>
</body>
</html>
